const PA=[{n:'Mr. Ravi',e:'👨',w:54,h:150,c:'Healthy'},{n:'Mrs. Meena',e:'👩',w:63,h:150,c:'Overweight'},{n:'Mr. Kumar',e:'👨‍🦳',w:140,h:200,c:'Obese'},{n:'Mrs. Priya',e:'👩‍🦰',w:36,h:150,c:'Underweight'}],CAT=['Underweight','Healthy','Overweight','Obese'];
function doctorLab(){const s=S.st,i=s.pi||0,p=PA[i],bm=p.w*10000/(p.h*p.h),m=fmt(p.h/100),L=lvl(5,`DOCTOR'S CLINIC ${i+1}/4`),calcDone=s['d_bm'+i],clsDone=s['cl'+i];
const sc=`<div class="t"><div style="font-size:80px">${p.e}</div><div class="big">${p.n}</div><span class="chip">⚖️ ${p.w} kg</span><span class="chip">📏 ${p.h} cm</span><div style="margin-top:10px;text-align:left"><b>BMI chart</b> <small>(for grown-ups)</small><br><span class="chip">Below 18.5 · Underweight</span><span class="chip">18.5 to 25 · Healthy</span><span class="chip">25 to 30 · Overweight</span><span class="chip">Over 30 · Obese</span></div></div>`;let b;
if(!calcDone)b=L+bolt(`Find ${p.n}'s BMI. Use the calculator: BMI = weight ÷ (height in m × height in m).`)+ct('bm'+i,{t:bm,u:'BMI',ok:'BMI found! Now pick the group.',next:()=>0,hints:['First change cm to m: divide by 100.',`${p.h} ÷ 100 = ${m}. Then ${m} × ${m}. Then ${p.w} ÷ that answer.`,`The answer is ${bm}.`],w:v=>'Not yet. Do cm ÷ 100, then m × m, then weight ÷ that answer.'});
else if(!clsDone)b=L+bolt(`BMI = ${bm}. Which group is ${p.n} in?`)+`<div class="g">${CAT.map(x=>`<button class="btn" onclick="clsPick('${x}')">${x}</button>`).join('')}</div>`;
else b=L+bolt(`${p.n} has a BMI of ${bm}: ${p.c}!`)+`<div class="row">${i<3?`<button class="btn go" onclick="nextP()">NEXT PATIENT ➜</button>`:`<button class="btn go" onclick="go('cert')">🏅 GET CERTIFICATE</button>`}</div>`;
return `<div class="two"><div class="card">${sc}</div><div class="card">${b}</div></div>`}
function clsPick(x){const i=S.st.pi||0,p=PA[i],bm=p.w*10000/(p.h*p.h);if(x==p.c){S.st['cl'+i]=1;S.pts['dr'+i]=S.pts['dr'+i]||PT['dr'+i];S.st.msg='⭐ Correct! '+bm+' is '+p.c+'.';S.mood='h'}else{S.tries['dr'+i]=(S.tries['dr'+i]||0)+1;S.mood='o';S.st.msg='Look at the BMI chart. Where does '+bm+' fit?'}render()}
function nextP(){S.st.pi=(S.st.pi||0)+1;S.st.cl=null;S.st.msg='';S.st.in='';S.mood='h';render()}
/* CERTIFICATE */
function cert(){const c=ch(),k=calc(),p=Object.values(S.pts).reduce((a,b)=>a+b,0);
return `<div class="card t" style="background:#fff7d6"><div style="font-size:70px">🏅</div><h1 style="font-size:46px">CERTIFIED HEALTH SCIENTIST</h1><div class="stars" style="font-size:40px">${'⭐'.repeat(Object.keys(S.pts).length)}</div>${mini(c,170,'h')}<p><b>${c.n}</b> · 📏 ${c.h} cm · ⚖️ ${c.w} kg · 🧮 BMI ${k.b}</p><div class="big">${p} / ${TOTAL}</div><p>💡 Hints used: ${S.hints}</p><div>${Object.keys(TN).map(x=>`<span class="chip">${TN[x]} ${S.pts[x]?'✅':'⬜'}</span>`).join('')}</div></div><div class="row"><button class="btn go" onclick="S=fresh();go('select')">🎮 PLAY WITH A NEW CHARACTER</button><button class="btn" onclick="S.st={};S.pts={};S.tries={};S.hints=0;go('height')">🔁 Replay</button></div>`}
render();
</script></body></html>
